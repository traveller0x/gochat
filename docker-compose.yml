services:
  mysql:
    image: mysql:8.4
    container_name: gochat-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在.env文件中设置MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gochat
      TZ: Asia/Shanghai

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - gochat_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  gochat_mysql_data: