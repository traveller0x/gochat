services:
  mysql:
    image: mysql:8.4
    container_name: gochat-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在.env文件中设置MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gochat
      TZ: Asia/Shanghai

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - gochat_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: gochat-redis
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在.env文件中设置REDIS_PASSWORD}

    command: sh -c 'redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"'

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - gochat_redis_data:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.0
    container_name: gochat-migrate
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database"
      - "mysql://root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/gochat?charset=utf8mb4&multiStatements=true"
      - "up"
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gochat-app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # 容器内用服务名，覆盖 config.yaml 里的 127.0.0.1
      GOCHAT_MYSQL_HOST: mysql
      GOCHAT_MYSQL_PORT: "3306"
      GOCHAT_REDIS_HOST: redis
      GOCHAT_REDIS_PORT: "6379"

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  gochat_mysql_data:
  gochat_redis_data:
